<!DOCTYPE html>
<html lang="es">
  <head>

    <title>Cantina Doña Rosa — Menú del día</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="encabezado">
      <h1>Cantina Doña Rosa</h1>
      <p class="subtitulo">Menú del día — comida casera</p>
    </header>

    <main>
      <article class="plato">
        <h2>Ñoquis del 29</h2>
        <p class="precio">$4.500</p>
        <p class="descripcion">Con salsa fileto y albahaca fresca.</p>
      </article>

      <article class="plato">
        <h2>Milanesa completa</h2>
        <p class="precio">$5.200</p>
        <p class="descripcion">Con huevo frito y papas fritas.</p>
      </article>

      <article class="plato">
        <h2>Tarta de jamón y queso</h2>
        <p class="precio">$4.800</p>
        <p class="descripcion">Con ensalada de estación.</p>
      </article>
    </main>

    <footer class="pie">
      <p>Av. Siempre Viva 742 — Pedidos al 5555-4444</p>
    </footer>
