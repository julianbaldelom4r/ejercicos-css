<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudio Foco — Galería</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="cabecera">
      <h1>Estudio Foco</h1>
      <p class="sello">Revelado profesional desde 1998</p>
    </header>

    <main class="galeria">
      <figure class="cuadro">
        <div class="foto"></div>
        <figcaption>Amanecer en el cerro</figcaption>
      </figure>

      <figure class="cuadro">
        <div class="foto"></div>
        <figcaption>Costa en invierno</figcaption>
      </figure>

      <figure class="cuadro">
        <div class="foto"></div>
        <figcaption>Girasoles de marzo</figcaption>
      </figure>

      <figure class="cuadro destacada">
        <div class="foto"></div>
        <figcaption>Obra de la semana</figcaption>
      </figure>

      <figure class="cuadro">
        <div class="foto"></div>
        <figcaption>Ciudad de noche</figcaption>
      </figure>

      <figure class="cuadro">
        <div class="foto"></div>
        <figcaption>Pingüinos en Punta Tombo</figcaption>
      </figure>
    </main>
  </body>
</html>
