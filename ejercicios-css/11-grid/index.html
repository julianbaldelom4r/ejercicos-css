<!DOCTYPE html>
<html lang="es">
  <head>

    <title>Sala Aurora — Muestra de otoño</title>
    <link rel="stylesheet" href="styles.css" />

    <header class="cabecera">
      <h1>Sala Aurora — Muestra de otoño</h1>

    <main class="galeria">
      <article class="obra destacada">
        <div class="lienzo"></div>
        <h2>Amanecer sobre el río</h2>
        <p>Marina Álvarez</p>
      </article>

      <article class="obra">
        <div class="lienzo"></div>
        <h2>Lluvia en la ciudad</h2>
        <p>Bruno Pérez</p>
      </article>

      <article class="obra">
        <div class="lienzo"></div>
        <h2>Girasoles de marzo</h2>
        <p>Carla Díaz</p>
      </article>

      <article class="obra">
        <div class="lienzo"></div>
        <h2>La cordillera</h2>
        <p>Damián Ruiz</p>
      </article>

      <article class="obra">
        <div class="lienzo"></div>
        <h2>Noche austral</h2>
        <p>Elena Sosa</p>
      </article>

      <article class="obra">
        <div class="lienzo"></div>
        <h2>Otoño en el parque</h2>
        <p>Fabián Moyano</p>
      </article>
    </main>
  </body>
</html>
