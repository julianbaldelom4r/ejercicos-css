<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Café Aroma</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="barra">
      <span class="logo"> Café Aroma</span>
      <nav class="links">
        <a href="#">Menú</a>
        <a href="#">Nuestra historia</a>
        <a href="#">Visitános</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Tostamos hoy, servimos hoy</h1>
      <p>Café de especialidad y facturas caseras en pleno centro.</p>
    </section>

    <main>
      <h2>Los favoritos</h2>
      <section class="tarjetas">
        <article class="tarjeta">
          <div class="emoji"></div>
          <h3>Flat white</h3>
          <p>$3.200</p>
        </article>

        <article class="tarjeta">
          <div class="emoji"></div>
          <h3>Medialunas</h3>
          <p>$2.800</p>
        </article>

        <article class="tarjeta">
          <div class="emoji"></div>
          <h3>Cheesecake</h3>
          <p>$4.100</p>
        </article>

        <article class="tarjeta">
          <div class="emoji"></div>
          <h3>Frappé</h3>
          <p>$3.600</p>
        </article>
      </section>

      <p class="nota">
        Abrimos todos los días de 8 a 20 h. Aceptamos mascotas.
      </p>
    </main>
  </body>
</html>
