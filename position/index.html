<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>positions</title>
    <style>
      body {
        margin: 0px;
        padding: 0px;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }
      header {
        width: 100%;
        padding: 4px;
        border-bottom: 2px solid #2323c8;
        background-color: rgb(29, 21, 186);
        box-sizing: border-box;
      }
      ul {
        width: 100%;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        list-style: none;
        padding: 0;
      }

      a {
        text-decoration: none;
        color: white;
        position: relative;
      }
      a::before {
        content: "";
        width: 0%;
        border-bottom: 2px solid white;
        position: absolute;
        bottom: -2px;
        transition: all 0.3s;
      }

      a:hover::before {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">AboutUs</a></li>
          <li><a href="#">constact</a></li>
          <li><a href="#">Princing</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>
