<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box sizing</title>
    <style>
      .box {
        border: 10px solid black;
        background-color: orangered;
        width: 200px;
        height: 150px;
        padding: 3px;
        margin: 0 auto;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <h1>box sizing</h1>
    <div class="box"></div>
  </body>
</html>
